<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

<div class="container mx-auto p-6 max-w-6xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Student Management Dashboard</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-lg shadow-md h-fit">
            <h2 id="form-title" class="text-xl font-semibold mb-4 text-gray-700">Add New Student</h2>
            <form id="student-form" class="space-y-4">
                <input type="hidden" id="student-id">

                <div>
                    <label class="block text-sm font-medium text-gray-600">Full Name</label>
                    <input type="text" id="name" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600">Email Address</label>
                    <input type="email" id="email" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600">Age (Must be 18+)</label>
                    <input type="number" id="age" required class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300 outline-none">
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition">Save Student</button>
                    <button type="button" id="cancel-btn" class="hidden w-full bg-gray-400 hover:bg-gray-500 text-white font-medium py-2 rounded-md transition">Cancel</button>
                </div>
            </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md md:col-span-2">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Registered Students</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-gray-200 text-gray-700 uppercase text-sm">
                        <th class="p-3">ID</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Email</th>
                        <th class="p-3">Age</th>
                        <th class="p-3 text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="student-table-body" class="text-gray-600 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
